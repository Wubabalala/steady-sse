<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>SteadySSE Demo</title>
    <style>
        body { font-family: monospace; max-width: 600px; margin: 40px auto; }
        #output { white-space: pre-wrap; background: #f0f0f0; padding: 16px; min-height: 200px; }
        button { padding: 8px 16px; margin: 8px 4px; cursor: pointer; }
    </style>
</head>
<body>
    <h1>SteadySSE Demo</h1>
    <button onclick="startStream()">Start Stream</button>
    <button onclick="stopStream()">Stop Stream</button>
    <div id="output"></div>

    <script>
        let eventSource = null;

        function startStream() {
            stopStream();
            const output = document.getElementById('output');
            output.textContent = 'Connecting...\n';

            eventSource = new EventSource('/stream');

            eventSource.addEventListener('chunk', function(e) {
                const data = JSON.parse(e.data);
                output.textContent += data.content;
            });

            eventSource.addEventListener('done', function(e) {
                output.textContent += '\n[Stream completed]';
                eventSource.close();
            });

            eventSource.onerror = function() {
                output.textContent += '\n[Connection error]';
                eventSource.close();
            };
        }

        function stopStream() {
            if (eventSource) {
                eventSource.close();
                eventSource = null;
            }
        }
    </script>
</body>
</html>
